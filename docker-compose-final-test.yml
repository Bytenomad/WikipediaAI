version: '3.8'

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui-final
    ports:
      - "8081:8080"
    volumes:
      - ./open-webui/vector_db:/app/vector_db
      - ./open-webui/uploads:/app/uploads
    environment:
      - WEBUI_NAME=WikiAI
      - DATABASE_URL=sqlite:///vector_db/chroma.sqlite3
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - INIT_DB=1
      - WEBUI_SECRET_KEY=test-secret-key
      - DISABLE_SIGNUP=false
      - LOG_LEVEL=DEBUG
    command: >
      bash -c "
        echo 'Testing database connection...' &&
        python3 -c 'import sqlite3; conn = sqlite3.connect(\"/app/vector_db/chroma.sqlite3\"); print(\"Database connected successfully\"); conn.close()' &&
        echo 'Starting Open WebUI server...' &&
        python3 -m open_webui.main
      "
    networks:
      - webui-net

networks:
  webui-net:
    driver: bridge