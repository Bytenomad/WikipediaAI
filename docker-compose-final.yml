version: '3.8'

services:
  wikipedia-ai:
    build: .
    container_name: wikipedia-ai
    volumes:
      - ./wikipedia/downloads:/app/wikipedia/downloads
      - ./data/qdrant:/app/data/qdrant
      - ./open-webui/vector_db:/app/open-webui/vector_db
    environment:
      - PYTHONPATH=/app
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6334
      - OLLAMA_URL=http://host.docker.internal:11434
    depends_on:
      - qdrant
    networks:
      - wikipedia-net

  open-webui:
    image: ghcr.io/open-webui/open-webui:0.13.4
    container_name: open-webui
    ports:
      - "8081:8080"
    volumes:
      - ./open-webui/vector_db:/app/vector_db
      - ./open-webui/uploads:/app/uploads
    environment:
      - WEBUI_NAME=WikiAI
      - DATABASE_URL=sqlite:///vector_db/chroma.sqlite3
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - INIT_DB=1
      - WEBUI_SECRET_KEY=test-secret-key
      - DISABLE_SIGNUP=false
      - LOG_LEVEL=DEBUG
      - ENABLE_VERSION_UPDATE_CHECK=false
    command: > 
      bash -c "
        echo 'Starting Open WebUI with database at: $$DATABASE_URL' &&
        ls -la /app/vector_db &&
        python3 -c 'import sqlite3; conn = sqlite3.connect(\\\"/app/vector_db/chroma.sqlite3\\\"); print(\\\"Database connected successfully\\\"); conn.close()' &&
        echo 'Starting Open WebUI server...' &&
        exec python3 -m open_webui.main
      "
    depends_on:
      - wikipedia-ai
    networks:
      - wikipedia-net

  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: qdrant
    ports:
      - "6334:6333"
      - "6335:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks:
      - wikipedia-net

networks:
  wikipedia-net:
    driver: bridge