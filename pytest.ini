[pytest]
# Configure pytest to work with our src layout
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Add markers for different types of tests
markers =
    unit: Unit tests that don't require external services  
    integration: Integration tests that use databases or other services
    slow: Slow-running tests
    
# Don't collect test files from virtual environments
norecursedirs = .venv .venv-backup *site-packages* manual

# Make sure we don't interfere with Python path by default
addopts = 
    --strict-markers
    --tb=short
