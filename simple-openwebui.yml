version: '3.8'

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: simple-openwebui
    ports:
      - "8082:8080"
    volumes:
      - ./open-webui/vector_db:/app/vector_db
      - ./open-webui/uploads:/app/uploads
      - ./open-webui/.webui_secret_key:/app/.webui_secret_key
    environment:
      - WEBUI_NAME=WikiAI
      - DATABASE_URL=sqlite:////app/vector_db/chroma.sqlite3
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - WEBUI_SECRET_KEY_FILE=/app/.webui_secret_key
      - INIT_DB=true
      - WEBUI_DEBUG=true
    networks:
      - simple-net

networks:
  simple-net:
    driver: bridge