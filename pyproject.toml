[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wikipedia-ai"
version = "0.1.0"
description = "Wikipedia AI Retrieval System with local LLM integration"
readme = "README.md"
authors = [
    {name = "AI Development Team"},
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.13"
dependencies = [
    "annotated-types==0.8.0",
    "anyio==4.16.0",
    "beautifulsoup4==4.15.0",
    "certifi==2026.10.23",
    "charset-normalizer==3.5.2",
    "grpcio==1.85.1",
    "h11==0.16.0",
    "h2==4.4.1",
    "hpack==4.2.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "hyperframe==6.1.0",
    "idna==3.20",
    "libzim==4.1.0",
    "lxml==6.1.3",
    "numpy==2.5.4",
    "portalocker==4.4.2",
    "protobuf==7.36.2",
    "pydantic==2.14.3",
    "pydantic_core==2.50.4",
    "qdrant-client==1.20.0",
    "requests==2.34.2",
    "soupsieve==4.1.1",
    "typing-inspection==0.4.5",
    "typing_extensions==4.16.0",
    "urllib3==2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
    "mypy>=1.0",
]

[project.scripts]
wikipedia-ingest = "wikipedia_ai.ingestion:main"