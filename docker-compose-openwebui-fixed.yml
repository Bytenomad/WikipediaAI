services:
  wikipedia-ai:
    build: .
    container_name: wikipedia-ai
    volumes:
      - ./wikipedia/downloads:/app/wikipedia/downloads
      - ./data/qdrant:/app/data/qdrant
      - ./open-webui/vector_db:/app/open-webui/vector_db
      - ./open-webui/uploads/images:/app/open-webui/uploads/images
      - ./test_zim_file.zim:/app/test_zim_file.zim
    environment:
      - PYTHONPATH=/app
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6334
      - OLLAMA_URL=http://host.docker.internal:11434
      # Make sure the ZIM path is accessible from within Docker
      - ZIM_PATH=/app/test_zim_file.zim
    depends_on:
      - qdrant
    networks:
      - wikipedia-net

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "8081:8080"
    volumes:
      - ./open-webui/vector_db:/app/vector_db
      - ./open-webui/uploads:/app/uploads
      - ./open-webui/.webui_secret_key:/app/.webui_secret_key
    environment:
      - WEBUI_NAME=WikiAI
      - DATABASE_URL=sqlite:////app/vector_db/chroma.sqlite3
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - WEBUI_SECRET_KEY_FILE=/app/.webui_secret_key
      - INIT_DB=true
      - WEBUI_DEBUG=true
      - DISABLE_SIGNUP=false
      - ALLOW_SOCIAL_LOGIN=false
      - WEBUI_AUTH=False
    depends_on:
      - wikipedia-ai
    networks:
      - wikipedia-net
    user: "0"

  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: qdrant
    ports:
      - "6334:6333"
      - "6335:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks:
      - wikipedia-net

networks:
  wikipedia-net:
    driver: bridge
